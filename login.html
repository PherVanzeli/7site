<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Funcionário | 7Site</title>
    <meta name="description" content="Portal do colaborador. Acesse seus holerites, envie atestados e veja os avisos internos.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">

    <!-- O JavaScript vai injetar o Cabeçalho aqui -->
    <div id="header-include"></div>

    <main class="login-container">
        <div class="login-box">
            <div class="login-texto">
                <span class="badge">Acesso Restrito</span>
                <h1>Portal do <strong>Colaborador</strong></h1>
                <p>Digite seu CPF e sua senha para acessar seus dados, holerites e avisos do RH.</p>
            </div>

            <form id="form-login" class="formulario-login">
                <label for="cpf">CPF *</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required autocomplete="off">

                <label for="senha">Senha *</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <!-- Mensagem de erro (Aparece se a senha estiver errada) -->
                <p class="mensagem-erro" id="msg-erro" style="display: none;">
                    ⚠️ CPF ou senha inválidos. Tente novamente.
                </p>

                <button type="submit" class="btn-primario btn-enviar">Entrar no Portal</button>
                
                <a href="#" class="login-senha-esquecida">Esqueci minha senha</a>
            </form>
        </div>
    </main>

    <!-- O JavaScript vai injetar o Rodapé aqui -->
    <div id="footer-include"></div>

        <!-- Firebase (O Backend/Combustível) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <!-- Nossos Scripts (A Mecânica do Site) -->
    <script src="js/firebase.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/menu.js"></script>
    <script src="js/core/componentes.js"></script>
    <script src="js/core/guard.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
